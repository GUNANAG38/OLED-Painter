<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>OLED Touch Painter - GelectronLAB</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
<style>
:root {
    --bg-color: #f8fafc;
    --card-bg: #ffffff;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --accent: #2563eb;
    --border: #e2e8f0;
    --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
}

[data-theme='dark'] {
    --bg-color: #0f172a;
    --card-bg: #1e293b;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #3b82f6;
    --border: #334155;
    --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3);
}

* { box-sizing: border-box; touch-action: none; }
html, body {
    margin: 0; padding: 0; width: 100vw; height: 100vh; height: 100dvh;
    overflow: hidden; background-color: var(--bg-color); color: var(--text-main);
    font-family: sans-serif; display: flex; justify-content: center; align-items: center;
}

.app-container {
    width: 100%; max-width: 480px; height: 100%; max-height: 100vh;
    padding: 12px; display: flex; flex-direction: column; gap: 8px; justify-content: space-between;
}

.card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px;
}

.canvas-box {
    width: 100%;
    aspect-ratio: 128 / 64;
    background: #000000;
    border: 3px solid var(--border);
    border-radius: 8px;
    position: relative;
    overflow: hidden;
    cursor: crosshair;
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
}

.controls { display: flex; gap: 6px; }

button {
    padding: 12px; border-radius: 8px; border: none; font-weight: 600; font-size: 0.9rem; cursor: pointer;
    transition: transform 0.1s, background 0.2s;
}
button:active { transform: scale(0.97); }

.btn-primary { background: var(--accent); color: white; flex: 2; }
.btn-danger { background: #ef4444; color: white; flex: 1; }
.btn-secondary { background: var(--border); color: var(--text-main); font-size: 0.75rem; padding: 6px 10px; }

.result-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
}
</style>
</head>
<body data-theme="light">

<div class="app-container">
    <section class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-weight: 700; font-size: 1.1rem;">OLED Touch Painter</span>
            <button class="btn-secondary" onclick="toggleTheme()">Switch Theme</button>
        </div>
        <div style="font-size: 0.75rem; color: var(--text-muted);">GelectronLAB • Mini MicroKit PT-L</div>
    </section>

    <section class="card" style="flex: 1; justify-content: center; align-items: center;">
        <div style="width: 100%; display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 600; color: var(--text-muted);">
            <span>Virtual OLED (128x64)</span>
            <span>Touch Screen Ready</span>
        </div>
        
        <div class="canvas-box">
            <canvas id="drawCanvas"></canvas>
        </div>

        <div class="controls" style="width: 100%; margin-top: 4px;">
            <button class="btn-danger" onclick="clearCanvas()">ลบหน้าจอ</button>
            <button class="btn-primary" onclick="sendDrawing()">กดส่งไปที่บอร์ด</button>
        </div>
    </section>

    <section class="card">
        <div class="result-footer">
            <span style="font-size: 0.75rem; color: var(--text-muted);">MQTT : <b id="mqtt-status" style="color: #ef4444;">Connecting...</b></span>
            <span style="font-size: 0.75rem; color: var(--accent);" id="send-status">พร้อมใช้งาน</span>
        </div>
    </section>
</div>

<script>
window.addEventListener('DOMContentLoaded', () => {
    const savedTheme = localStorage.getItem("theme") || "light";
    document.body.dataset.theme = savedTheme;
    initCanvas();
});

function toggleTheme() {
    const body = document.body;
    const currentTheme = body.dataset.theme === 'dark' ? 'light' : 'dark';
    body.dataset.theme = currentTheme;
    localStorage.setItem("theme", currentTheme);
}

const canvas = document.getElementById('drawCanvas');
const ctx = canvas.getContext('2d');
let painting = false;

function initCanvas() {
    canvas.width = 128;
    canvas.height = 64;
    ctx.strokeStyle = '#ffffff'; 
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    
    return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
    };
}

canvas.addEventListener('mousedown', (e) => { painting = true; draw(e); });
canvas.addEventListener('mouseup', () => { painting = false; ctx.beginPath(); });
canvas.addEventListener('mousemove', draw);

canvas.addEventListener('touchstart', (e) => { painting = true; draw(e); e.preventDefault(); });
canvas.addEventListener('touchend', () => { painting = false; ctx.beginPath(); });
canvas.addEventListener('touchmove', (e) => { draw(e); e.preventDefault(); });

function draw(e) {
    if (!painting) return;
    const pos = getPos(e);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
}

function clearCanvas() {
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // ส่งคำสั่งเคลียร์หน้าจอไปที่บอร์ดทันที (ถ้าต้องการ)
    if (mqttClient && mqttClient.isConnected()) {
        let message = new Paho.MQTT.Message("CLEAR");
        message.destinationName = mqttTopic;
        mqttClient.send(message);
    }
    document.getElementById("send-status").textContent = "ลบหน้าจอแล้ว";
}

// --- ตั้งค่าระบบ MQTT ---
const mqttHost = "broker.emqx.io";
const mqttPort = 8084; 
const mqttTopic = "gelectronlab/oled_painter/draw";

let clientId = "WebClient-" + Math.floor(Math.random() * 100000);
let mqttClient = new Paho.MQTT.Client(mqttHost, Number(mqttPort), clientId);

mqttClient.onConnectionLost = function (responseObject) {
    document.getElementById("mqtt-status").textContent = "Disconnected";
    document.getElementById("mqtt-status").style.color = "#ef4444";
    setTimeout(connectMQTT, 4000);
};

function connectMQTT() {
    try {
        mqttClient.connect({
            onSuccess: function() {
                document.getElementById("mqtt-status").textContent = "Connected";
                document.getElementById("mqtt-status").style.color = "#16a34a";
            },
            onFailure: function(message) {
                document.getElementById("mqtt-status").textContent = "Failed";
                document.getElementById("mqtt-status").style.color = "#ef4444";
            },
            useSSL: true,
            timeout: 5
        });
    } catch(e) {
        console.error("MQTT Exception: ", e);
    }
}

connectMQTT();

// ฟังก์ชันส่งข้อมูลภาพจาก Canvas ไปยังบอร์ด (แปลงเป็นพิกเซลไบนารีหรือข้อมูลที่บอร์ดนำไปประมวลผลต่อได้ง่าย)
function sendDrawing() {
    if (!mqttClient.isConnected()) {
        alert("ยังไม่ได้เชื่อมต่อ MQTT Broker!");
        return;
    }

    // ดึงข้อมูลพิกเซลจาก Canvas (128x64 พิกเซล)
    const imgData = ctx.getImageData(0, 0, 128, 64);
    const data = imgData.data;
    
    // แปลงพิกเซลสีขาว/ดำ เป็นไบต์ (1 ไบต์เก็บได้ 8 พิกเซลแนวตั้ง หรือแปลงเป็นรูปแบบที่ส่งง่าย)
    // เพื่อความง่ายและเร็ว เราจะส่งเป็นสตริง '1' (จุดสีขาว) และ '0' (จุดสีดำ) ความยาว 8192 ตัว
    let pixelString = "";
    for (let i = 0; i < data.length; i += 4) {
        // เช็คความสว่าง ถ้าสว่าง (สีขาว) ให้เป็น '1' ถ้ามืด (สีดำ) ให้เป็น '0'
        let avg = (data[i] + data[i+1] + data[i+2]) / 3;
        pixelString += (avg > 128) ? "1" : "0";
    }

    let message = new Paho.MQTT.Message(pixelString);
    message.destinationName = mqttTopic;
    mqttClient.send(message);

    document.getElementById("send-status").textContent = "ส่งภาพไปที่บอร์ดแล้ว!";
    document.getElementById("send-status").style.color = "#16a34a";
}
</script>

</body>
</html>
